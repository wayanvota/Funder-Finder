services:
  - type: web
    name: funder-finder
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: KINDORA_MCP_URL
        value: https://kindora-mcp.azurewebsites.net/mcp
      - key: TAVILY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
